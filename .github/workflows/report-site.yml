name: Publish security report site

# Scans a target (the repo checkout by default, or whatever the Cloudflare
# Worker launcher passed as `target`) and pushes the rendered report to the
# strix-report-site R2 bucket, where cloudflare/report-worker serves it
# behind Supabase login. Findings and PoCs are sensitive, so this workflow
# must only ever publish to a store that sits behind real access control —
# never back to a public host.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Target to scan (path, URL, domain, or IP). Defaults to this repo checkout."
        required: false
        default: "./"

permissions:
  contents: read

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TARGET: ${{ github.event.inputs.target || './' }}
        # Exit code 2 means "vulnerabilities found" -- that's the expected,
        # successful outcome for a report we want published, not a failure.
        # Only exit code 1 (fatal/setup error) should fail this step.
        run: |
          set +e
          strix -n -t "$TARGET" --scan-mode standard --max-budget 25
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "Strix exited with code $code (fatal error, not just findings)." >&2
            exit "$code"
          fi

      - name: Fail unless the scan completed
        run: |
          run_json=$(ls -t strix_runs/*/run.json | head -1)
          status=$(jq -r .status "$run_json")
          if [ "$status" != "completed" ]; then
            echo "Strix run status is '$status' — the scan did not complete (likely budget exhausted). Raise --max-budget." >&2
            exit 1
          fi

      - name: Render report site
        run: uv run python scripts/render_report_site.py --output _site

      - name: Publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 r2 object put strix-report-site/latest/index.html \
            --file=_site/index.html --content-type=text/html --remote
